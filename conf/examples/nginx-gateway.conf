# 1. Tailscale HTTPS Domain (Uses official Let's Encrypt cert - zero warnings)
server {
    listen 443 ssl;
    server_name ~.*\.ts\.net$;

    ssl_certificate /etc/ssl/spiderbot/tailscale.crt;
    ssl_certificate_key /etc/ssl/spiderbot/tailscale.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    keepalive_timeout 65;

    root /home/spider/v2-web-ui/build;
    index index.html;

    location /cam-stream {
        proxy_pass http://127.0.0.1:8088/stream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location /cam-snapshot {
        proxy_pass http://127.0.0.1:8088/snapshot;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
    }

    location /cam-status {
        proxy_pass http://127.0.0.1:8088/status;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
    }

    location /mqtt {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    location ~* (index\.html|service-worker\.js|manifest\.json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 2. Local LAN / Hotspot / Default (HTTP 80 + HTTPS 443 with self-signed cert)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/ssl/spiderbot/selfsigned.crt;
    ssl_certificate_key /etc/ssl/spiderbot/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
